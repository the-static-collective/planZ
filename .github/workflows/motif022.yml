name: planZ MOTIF-022 Question Classical Planning
on:
  push:
    branches:
      - research/022-question-to-plan
  pull_request:
    paths:
      - 'scripts/motif022-plan.mjs'
      - 'test/motif022-plan.test.mjs'
jobs:
  question-planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
