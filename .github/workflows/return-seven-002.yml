name: RETURN-SEVEN-002 native evidence return to recursive PlanZ
on:
  pull_request:
    paths: ["reactor/return-seven*",".github/workflows/return-seven-002.yml"]
  push:
    branches: ["experiment/return-seven-native-002"]
    paths: ["reactor/return-seven*",".github/workflows/return-seven-002.yml"]
permissions:
  contents: read
jobs:
  return-seven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test reactor/collide.test.mjs reactor/recursive.test.mjs reactor/return-seven.test.mjs
