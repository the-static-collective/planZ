name: planZ public attention feed validation
on:
  push:
    branches: [main]
    paths: [public/**, scripts/**, test/**, package.json, .github/workflows/validate.yml]
  pull_request:
    paths: [public/**, scripts/**, test/**, package.json, .github/workflows/validate.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
