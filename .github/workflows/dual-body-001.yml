name: DUAL-BODY-001 offline compatibility
on:
  push:
    branches:
      - proposal/master-servant-field-score-001
  pull_request:
permissions:
  contents: read
jobs:
  offline-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate dual-machine probe and offline courier boundaries
        run: python3 -m unittest discover -s tools -p 'test_dual_body_compat.py' -v
      - name: Validate ROOMTONE simulated consent boundaries
        run: node --test fixtures/roomtone-001/evaluate.test.mjs
