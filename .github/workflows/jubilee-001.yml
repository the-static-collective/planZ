name: JUBILEE-001 three-town rehearsal
on:
  push:
    branches:
      - build/jubilee-road-room-001
      - build/jubilee-field-kit-002
  pull_request:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Exercise Jubilee boundaries and inherited ROOMTONE
        run: node --test jubilee/tests/*.test.mjs fixtures/roomtone-001/evaluate.test.mjs
      - name: Check portable build and cold replay
        run: |
          node jubilee/bin/build.mjs --check
          node jubilee/bin/build-field.mjs --check
          node jubilee/bin/rehearse.mjs build jubilee/fixtures/three-towns.json jubilee/fixtures/journey.json /tmp/jubilee-witness.json
          node jubilee/bin/rehearse.mjs verify jubilee/fixtures/three-towns.json jubilee/fixtures/journey.json /tmp/jubilee-witness.json
      - name: Install browser test tools
        run: |
          npm ci --prefix jubilee --ignore-scripts
          cd jubilee
          npx playwright install --with-deps chromium
      - name: Check offline browser journeys
        run: |
          node jubilee/tests/browser.mjs
          node jubilee/tests/field-browser.mjs
